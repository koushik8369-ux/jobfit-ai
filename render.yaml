services:
  - type: web
    name: jobfit-ai-api
    runtime: node
    region: oregon
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    rootDir: server
    buildCommand: npm ci && npm test
    startCommand: npm start
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_VERSION
        value: "24.22.1"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400000
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: AI_PROVIDER
        value: deterministic
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: LLM_TIMEOUT
        value: 30s

  - type: web
    name: jobfit-ai-frontend
    runtime: static
    autoDeployTrigger: checksPass
    rootDir: frontend
    buildCommand: npm ci && npm test && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "24.22.1"
      - key: VITE_API_BASE_URL
        sync: false
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html